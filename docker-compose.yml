services:
  # Dozzle - Docker container log viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_LEVEL=info

  # FileBrowser - Web-based file manager
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8081:8070"
    volumes:
      - ./filebrowser/data:/srv
      - ./filebrowser/config:/config
      - ./filebrowser/database:/database

  # Homepage - Dashboard
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_FILEBROWSER_USERNAME=${FILEBROWSER_USERNAME}
      - HOMEPAGE_VAR_FILEBROWSER_PASSWORD=${FILEBROWSER_PASSWORD}
    volumes:
      - ./homepage/config:/app/config
      - ./homepage/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock

  # Pi-hole - Network-wide ad blocker
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    cap_add:
      - NET_ADMIN
    hostname: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
    environment:
      TZ: ${PIHOLE_TZ}
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}
      SERVERIP: ${PIHOLE_SERVERIP}
      MAXDBDAYS: 30
    volumes:
      - ./pihole/etc-pihole/:/etc/pihole/
      - ./pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/

  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest
    container_name: pinchflat
    restart: unless-stopped
    ports:
      - "8945:8945"
    volumes:
      - ./pinchflat/config:/config
      - ./pinchflat/downloads:/downloads
    environment:
      - TZ=${PIHOLE_TZ:-UTC}

  # Dockhand - Docker Management UI
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 3001:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dockhand/data:/app/data
  
  # Stirling PDF - PDF manipulation tools
  stirling-pdf:
    image: stirlingtools/stirling-pdf
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./stirlingtools/configs:/configs
      - ./stirlingtools/customFiles:/customFiles
    environment:
      - DOCKER_ENABLE_SECURITY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WUD - What's up Docker (update checker + auto-updater, replaces Watchtower)
  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    ports:
      - "3033:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./wud/data:/store
    labels:
      # WUD 9.0.2 has no self-update guard: updating itself would stop its own
      # container mid-swap and leave it down. Bump WUD by hand.
      - "wud.trigger.exclude=docker.local"
    environment:
      - TZ=Asia/Jerusalem
      - WUD_AUTH_ADMIN_USER=admin
      - WUD_AUTH_ADMIN_PASSWORD=${WUD_AUTH_ADMIN_PASSWORD}

      # Watcher: scan every 2 hours, all containers unless labelled wud.watch=false.
      # WATCHDIGESTDEFAULT=true is required for :latest tags on Docker Hub,
      # otherwise digest-only updates are never detected; the 2h interval keeps
      # the resulting manifest queries under Docker Hub's anonymous quota.
      - WUD_WATCHER_LOCAL_CRON=0 */2 * * *
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=true
      - WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT=true

      # Auto-update trigger (pull + recreate). Containers opt out with
      # the label wud.trigger.exclude=docker.local (monitor-only).
      - WUD_TRIGGER_DOCKER_LOCAL_PRUNE=true

      # Authenticate to ghcr: anonymous tag-list queries on large repos
      # (immich) hit HTTP 429 and the container check is skipped.
      - WUD_REGISTRY_GHCR_PUBLIC_USERNAME=${GHCR_USERNAME}
      - WUD_REGISTRY_GHCR_PUBLIC_TOKEN=${GHCR_TOKEN}

      # Silence the per-image "watching digest may be throttled" warning,
      # which WATCHDIGESTDEFAULT=true emits for every Docker Hub image.
      - WUD_REGISTRY_HUB_PUBLIC_SUPPRESSDIGESTWATCHWARNING=true

      # Email trigger. ONCE defaults to true: one mail per detected update.
      # Port 465 with TLS_ENABLED=true: WUD maps that flag to nodemailer's
      # "secure", which is implicit TLS. On 587 (STARTTLS) it fails with
      # "wrong version number".
      - WUD_TRIGGER_SMTP_GMAIL_HOST=smtp.gmail.com
      - WUD_TRIGGER_SMTP_GMAIL_PORT=465
      - WUD_TRIGGER_SMTP_GMAIL_TLS_ENABLED=true
      - WUD_TRIGGER_SMTP_GMAIL_USER=${WUD_EMAIL_USER}
      - WUD_TRIGGER_SMTP_GMAIL_PASS=${WUD_EMAIL_PASSWORD}
      - WUD_TRIGGER_SMTP_GMAIL_FROM_ADDRESS=${WUD_EMAIL_FROM}
      - WUD_TRIGGER_SMTP_GMAIL_FROM_NAME=WUD
      - WUD_TRIGGER_SMTP_GMAIL_TO=${WUD_EMAIL_TO}
    healthcheck:
      test: curl --fail http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # WireGuard - VPN server
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - WG_HOST=liorgadol.ddnsfree.com
      - WG_PORT=51820
      - PASSWORD_HASH=${WIREGUARD_PASS_HASH}
      - TZ=Asia/Jerusalem
    volumes:
      - ./wgeasy/config:/etc/wireguard
      - /lib/modules:/lib/modules
    ports:
      - 51820:51820/udp
      - 51821:51821/tcp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  # Glances - System monitoring dashboard
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    pid: host
    ports:
      - "61208:61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GLANCES_OPT=-w

  # go2rtc - Camera stream server (RTSP/WebRTC)
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: splitcam_go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"      # Web UI and API
      - "8554:8554"      # RTSP server
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC
    volumes:
      - ./splitcam/config:/config
    environment:
      - CAMERA_USER=${CAMERA_USER}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - CAMERA1_IP=${CAMERA1_IP}
      - CAMERA2_IP=${CAMERA2_IP}
    networks:
      - camera-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1984/api/streams"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Splitcam web - Camera viewer front-end (proxies /api/ to go2rtc)
  splitcam-web:
    image: nginx:alpine
    container_name: splitcam_camera-web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./splitcam/index.html:/usr/share/nginx/html/index.html:ro
      - ./splitcam/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - camera-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Cutter - Image background removal + print bleed tool (API)
  cutter-backend:
    build:
      context: ./cutter
      dockerfile: Dockerfile.backend
    container_name: cutter_backend
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    expose:
      - "8000"
    networks:
      - cutter-net

  # Cutter web - React UI on nginx (proxies /remove-bg, /add-bleed to backend)
  cutter-frontend:
    build:
      context: ./cutter
      dockerfile: Dockerfile.frontend
    container_name: cutter_frontend
    restart: unless-stopped
    depends_on:
      - cutter-backend
    labels:
      - "wud.watch=false"
    ports:
      - "8083:80"
    networks:
      - cutter-net

  # Emby - Media server (hw transcode via /dev/dri, libraries over CIFS)
  emby:
    image: emby/embyserver:latest
    container_name: emby
    restart: unless-stopped
    environment:
      - UID=1000
      - GID=1000
      - GIDLIST=1000,44,993   # own gid, video=44, render=993
      - TZ=Asia/Jerusalem
    ports:
      - "8096:8096"    # http
      - "8920:8920"    # https
    devices:
      - /dev/dri:/dev/dri   # Intel/AMD hw transcode. Remove if no iGPU.
    volumes:
      - ./emby/config:/config
      - movies:/media/movies
      - movies2:/media/movies2
      - movies3:/media/movies3
      - movies4:/media/movies4
      - movies4k:/media/movies4k
      - series:/media/series
      - music:/media/music
      - camera:/media/camera

networks:
  camera-net:
    driver: bridge
  cutter-net:
    driver: bridge

volumes:
  movies:
    driver_opts: &cifs
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,uid=1000,gid=1000,file_mode=0664,dir_mode=0775,nobrl,iocharset=utf8"
      device: "//192.168.1.2/Movies"
  movies2:
    driver_opts:
      <<: *cifs
      device: "//192.168.1.2/Movies 2"
  movies3:
    driver_opts:
      <<: *cifs
      device: "//192.168.1.2/Movies 3"
  movies4:
    driver_opts:
      <<: *cifs
      device: "//192.168.1.2/Movies 4"
  movies4k:
    driver_opts:
      <<: *cifs
      device: "//192.168.1.2/Movies 4k"
  series:
    driver_opts:
      <<: *cifs
      device: "//192.168.1.2/Series"
  music:
    driver_opts:
      <<: *cifs
      device: "//192.168.1.2/Music"
  camera:
    driver_opts:
      <<: *cifs
      device: "//192.168.1.2/Camera"
