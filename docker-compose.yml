services:
  # Dozzle - Docker container log viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    labels:
      - "kuma.dozzle.docker.name=Dozzle"
      - "kuma.dozzle.docker.docker_container=dozzle"
      - "kuma.dozzle-web.http.name=Dozzle web"
      - "kuma.dozzle-web.http.url=http://192.168.1.200:8080/"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dozzle/data:/data
    environment:
      - DOZZLE_LEVEL=info
      - TZ=${TZ}

  # FileBrowser - Web-based file manager
  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    labels:
      - "kuma.filebrowser.docker.name=FileBrowser"
      - "kuma.filebrowser.docker.docker_container=filebrowser"
      - "kuma.filebrowser-web.http.name=FileBrowser web"
      - "kuma.filebrowser-web.http.url=http://192.168.1.200:8081/"
    restart: unless-stopped
    # Runs as UID 1000; the mounted directories must be writable by it.
    environment:
      - FILEBROWSER_CONFIG=/config/config.yaml
      - FILEBROWSER_DATABASE_PATH=/database/database.sqlite
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
      - TZ=${TZ}
    ports:
      - "8081:80"
    volumes:
      - ./filebrowser/data:/srv
      - ./filebrowser/config:/config
      - ./filebrowser/database:/database

  # Homarr - Dashboard edited in the browser.
  # Boards, apps and integrations live in its database under ./homarr/appdata.
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    labels:
      - "kuma.homarr.docker.name=Homarr"
      - "kuma.homarr.docker.docker_container=homarr"
      - "kuma.homarr-web.http.name=Homarr web"
      - "kuma.homarr-web.http.url=http://192.168.1.200:7575/"
    restart: unless-stopped
    ports:
      - "7575:7575"
    # Resolve through Pi-hole: status pings run from this container, and only
    # Pi-hole knows *.gadol.lan (Docker hands containers the host's upstream DNS).
    dns:
      - 192.168.1.200
    environment:
      # Encrypts integration credentials in the database. Changing it makes
      # the stored ones unreadable. Generate with: openssl rand -hex 32
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
      - TZ=${TZ}
    volumes:
      - ./homarr/appdata:/appdata
      # Docker integration: container status and start/stop from the board
      - /var/run/docker.sock:/var/run/docker.sock

  # Pi-hole - Network-wide ad blocker
  pihole:
    container_name: pihole
    labels:
      - "kuma.pihole.docker.name=Pi-hole"
      - "kuma.pihole.docker.docker_container=pihole"
      - "kuma.pihole-web.http.name=Pi-hole web"
      - "kuma.pihole-web.http.url=http://192.168.1.200:8053/admin/"
      - "kuma.pihole-dns.dns.name=Pi-hole DNS"
      - "kuma.pihole-dns.dns.hostname=google.com"
      - "kuma.pihole-dns.dns.dns_resolve_server=192.168.1.200"
      - "kuma.pihole-dns.dns.port=53"
    image: pihole/pihole:latest
    cap_add:
      - NET_ADMIN
    hostname: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"   # 80 belongs to Caddy
    environment:
      TZ: ${TZ}
      # v6 ignores WEBPASSWORD and SERVERIP. Re-applied on every start, which
      # also makes the password read-only in the web UI.
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      MAXDBDAYS: 30
      # Wildcard: gadol.lan and every name under it resolve to the host,
      # where Caddy routes them. Pi-hole v6 only; it also makes the
      # setting read-only in the web UI.
      FTLCONF_misc_dnsmasq_lines: "address=/gadol.lan/192.168.1.200"
    volumes:
      - ./pihole/etc-pihole/:/etc/pihole/
      - ./pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/

  # Caddy - Reverse proxy: <service>.gadol.lan to each web UI (see caddy/Caddyfile)
  caddy:
    image: caddy:latest
    container_name: caddy
    labels:
      - "kuma.caddy.docker.name=Caddy"
      - "kuma.caddy.docker.docker_container=caddy"
      - "kuma.caddy-web.http.name=Caddy web"
      - "kuma.caddy-web.http.url=http://192.168.1.200/"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"   # immich.gadol.lan, the only HTTPS name
    # Admin API (2019) is not published: it has no auth, and anyone reaching
    # it can rewrite every route. caddy/ui and Homarr reach it at caddy:2019
    # over the compose network.
    volumes:
      # Writable: caddy/ui saves edits into it
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      - TZ=${TZ}

  # caddy/ui - Web UI for the Caddy above. Edits caddy/Caddyfile in place
  # (docker exec + tee into the caddy container), then reloads Caddy through
  # its admin API at caddy:2019. The Caddyfile stays the source of truth.
  # The backend name is fixed: the frontend's nginx proxies to caddy-ui-backend:3001.
  caddy-ui-backend:
    image: zackwag/caddy-ui-backend:latest
    container_name: caddy-ui-backend
    labels:
      - "kuma.caddy-ui-backend.docker.name=caddy/ui backend"
      - "kuma.caddy-ui-backend.docker.docker_container=caddy-ui-backend"
    restart: unless-stopped
    depends_on:
      - caddy
    environment:
      # Creates the instance for the caddy container on first start
      - CADDY_ADMIN_URL=http://caddy:2019
      # Keep route titles out of the Caddyfile: its existing comments would
      # otherwise be read as titles.
      - CADDYFILE_TITLES=false
      # Plain-HTTP origins get no Fetch Metadata from browsers, so login
      # writes are checked against this Origin instead.
      - CADDY_UI_EXTERNAL_URL=http://caddy.gadol.lan
      - CADDY_UI_USER=gadol
      - CADDY_UI_PASSWORD=${CADDY_UI_PASSWORD}
      # Signs login sessions. Generate with: openssl rand -base64 32
      - JWT_SECRET=${CADDY_UI_JWT_SECRET}
      - TZ=${TZ}
    volumes:
      # Root-equivalent: needed to edit the Caddyfile inside the caddy container
      - /var/run/docker.sock:/var/run/docker.sock
      - ./caddy-ui/data:/etc/caddy-ui

  # caddy/ui web - React UI on nginx, proxies /api/* to the backend
  caddy-ui-frontend:
    image: zackwag/caddy-ui-frontend:latest
    container_name: caddy-ui-frontend
    labels:
      - "kuma.caddy-ui-frontend.docker.name=caddy/ui"
      - "kuma.caddy-ui-frontend.docker.docker_container=caddy-ui-frontend"
      - "kuma.caddy-ui-frontend-web.http.name=caddy/ui web"
      - "kuma.caddy-ui-frontend-web.http.url=http://192.168.1.200:8084/"
    restart: unless-stopped
    depends_on:
      - caddy-ui-backend
    ports:
      - "8084:80"
    environment:
      - TZ=${TZ}

  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest
    container_name: pinchflat
    labels:
      - "kuma.pinchflat.docker.name=Pinchflat"
      - "kuma.pinchflat.docker.docker_container=pinchflat"
      - "kuma.pinchflat-web.http.name=Pinchflat web"
      - "kuma.pinchflat-web.http.url=http://192.168.1.200:8945/"
    restart: unless-stopped
    ports:
      - "8945:8945"
    volumes:
      - ./pinchflat/config:/config
      - ./pinchflat/downloads:/downloads
    environment:
      - TZ=${TZ}

  # Dockhand - Docker Management UI
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    labels:
      - "kuma.dockhand.docker.name=Dockhand"
      - "kuma.dockhand.docker.docker_container=dockhand"
      - "kuma.dockhand-web.http.name=Dockhand web"
      - "kuma.dockhand-web.http.url=http://192.168.1.200:3001/"
    restart: unless-stopped
    ports:
      - 3001:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dockhand/data:/app/data
    environment:
      - TZ=${TZ}
  
  # Stirling PDF - PDF manipulation tools
  stirling-pdf:
    image: stirlingtools/stirling-pdf
    container_name: stirling-pdf
    labels:
      - "kuma.stirling-pdf.docker.name=Stirling PDF"
      - "kuma.stirling-pdf.docker.docker_container=stirling-pdf"
      - "kuma.stirling-pdf-web.http.name=Stirling PDF web"
      - "kuma.stirling-pdf-web.http.url=http://192.168.1.200:8090/"
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./stirlingtools/configs:/configs
      - ./stirlingtools/customFiles:/customFiles
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WUD - What's up Docker (update checker + auto-updater)
  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    ports:
      - "3033:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./wud/data:/store
    labels:
      # WUD 9.0.2 has no self-update guard: updating itself would stop its own
      # container mid-swap and leave it down. Bump WUD by hand.
      - "wud.trigger.exclude=docker.local"
      - "kuma.wud.docker.name=WUD"
      - "kuma.wud.docker.docker_container=wud"
      - "kuma.wud-web.http.name=WUD web"
      - "kuma.wud-web.http.url=http://192.168.1.200:3033/health"
    environment:
      - TZ=${TZ}
      - WUD_AUTH_ADMIN_USER=gadol
      - WUD_AUTH_ADMIN_PASSWORD=${WUD_AUTH_ADMIN_PASSWORD}

      # Watcher: scan every 2 hours, all containers unless labelled wud.watch=false.
      # WATCHDIGESTDEFAULT=true is required for :latest tags on Docker Hub,
      # otherwise digest-only updates are never detected; the 2h interval keeps
      # the resulting manifest queries under Docker Hub's anonymous quota.
      - WUD_WATCHER_LOCAL_CRON=0 */2 * * *
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=true
      - WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT=true

      # Auto-update trigger (pull + recreate). Containers opt out with
      # the label wud.trigger.exclude=docker.local (monitor-only).
      - WUD_TRIGGER_DOCKER_LOCAL_PRUNE=true

      # Authenticate to ghcr: anonymous tag-list queries on large repos
      # (immich) hit HTTP 429 and the container check is skipped.
      - WUD_REGISTRY_GHCR_PUBLIC_USERNAME=${GHCR_USERNAME}
      - WUD_REGISTRY_GHCR_PUBLIC_TOKEN=${GHCR_TOKEN}

      # Silence the per-image "watching digest may be throttled" warning,
      # which WATCHDIGESTDEFAULT=true emits for every Docker Hub image.
      - WUD_REGISTRY_HUB_PUBLIC_SUPPRESSDIGESTWATCHWARNING=true

      # Telegram trigger (id telegram.bot). ONCE defaults to true: one message
      # per detected update. $$ escapes $ from Compose interpolation so WUD
      # receives the ${...} placeholders. It fires on detection, alongside the
      # docker.local trigger, so "updated" is not confirmation the pull
      # succeeded — and containers excluded from docker.local (WUD itself)
      # still get this message without being updated. WUD escapes the
      # MarkdownV2 itself.
      - WUD_TRIGGER_TELEGRAM_BOT_BOTTOKEN=${TELEGRAM_BOT_TOKEN}
      - WUD_TRIGGER_TELEGRAM_BOT_CHATID=${TELEGRAM_CHAT_ID}
      - WUD_TRIGGER_TELEGRAM_BOT_SIMPLETITLE=✅ $${container.name} updated
      - WUD_TRIGGER_TELEGRAM_BOT_SIMPLEBODY=$${container.name} → $${container.updateKind.remoteValue}
    healthcheck:
      test: curl --fail http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # WireGuard - VPN server. v15: host, port, admin login and client
  # settings live in its database (set in the setup wizard and Admin Panel),
  # not in environment variables.
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    labels:
      # :latest stopped at v14. :15 is a rolling tag that WUD would parse as
      # semver 15.0.0 and never update; see "Rolling major tags" in README.
      - 'wud.tag.transform=^\d+()$$ => rolling$$1'
      - "kuma.wg-easy.docker.name=wg-easy"
      - "kuma.wg-easy.docker.docker_container=wg-easy"
      - "kuma.wg-easy-web.http.name=wg-easy web"
      - "kuma.wg-easy-web.http.url=http://192.168.1.200:51821/"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      # Web UI is plain HTTP; v15 rejects logins over HTTP without this
      - INSECURE=true
      - TZ=${TZ}
    volumes:
      - ./wgeasy/config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp
      - 51821:51821/tcp
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  # Glances - System monitoring dashboard
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    labels:
      - "kuma.glances.docker.name=Glances"
      - "kuma.glances.docker.docker_container=glances"
      - "kuma.glances-web.http.name=Glances web"
      - "kuma.glances-web.http.url=http://192.168.1.200:61208/"
    restart: unless-stopped
    pid: host
    ports:
      - "61208:61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ}

  # Beszel - Server monitoring hub (history, alerts). Systems are added in its
  # UI; the agent below reports this host.
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    labels:
      - "kuma.beszel.docker.name=Beszel"
      - "kuma.beszel.docker.docker_container=beszel"
      - "kuma.beszel-web.http.name=Beszel web"
      - "kuma.beszel-web.http.url=http://192.168.1.200:8091/"
    restart: unless-stopped
    ports:
      - "8091:8090"   # 8090 belongs to Stirling PDF
    volumes:
      - ./beszel/data:/beszel_data
    environment:
      - TZ=${TZ}

  # Beszel agent - Reports this host's metrics to the hub. Host network so it
  # sees the real network interfaces; the hub connects to 192.168.1.200:45876.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    labels:
      - "kuma.beszel-agent.docker.name=Beszel agent"
      - "kuma.beszel-agent.docker.docker_container=beszel-agent"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel-agent/data:/var/lib/beszel-agent
    environment:
      - LISTEN=45876
      # Hub's public key, shown in the hub's "Add System" dialog
      - KEY=${BESZEL_AGENT_KEY}
      - TZ=${TZ}

  # go2rtc - Camera stream server (RTSP/WebRTC)
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: splitcam_go2rtc
    labels:
      - "kuma.go2rtc.docker.name=go2rtc"
      - "kuma.go2rtc.docker.docker_container=splitcam_go2rtc"
      - "kuma.go2rtc-web.http.name=go2rtc web"
      - "kuma.go2rtc-web.http.url=http://192.168.1.200:1984/"
    restart: unless-stopped
    ports:
      - "1984:1984"      # Web UI and API
      - "8554:8554"      # RTSP server
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC
    volumes:
      - ./splitcam/config:/config
    environment:
      - CAMERA_USER=${CAMERA_USER}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - CAMERA1_IP=${CAMERA1_IP}
      - CAMERA2_IP=${CAMERA2_IP}
      - TZ=${TZ}
    networks:
      - camera-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1984/api/streams"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Splitcam web - Camera viewer front-end (proxies /api/ to go2rtc)
  splitcam-web:
    image: nginx:alpine
    container_name: splitcam_camera-web
    labels:
      - "kuma.splitcam-web.docker.name=Splitcam web"
      - "kuma.splitcam-web.docker.docker_container=splitcam_camera-web"
      - "kuma.splitcam-web-web.http.name=Splitcam web web"
      - "kuma.splitcam-web-web.http.url=http://192.168.1.200:8082/"
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./splitcam/index.html:/usr/share/nginx/html/index.html:ro
      - ./splitcam/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=${TZ}
    networks:
      - camera-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Cutter - Image background removal + print bleed tool (API)
  cutter-backend:
    build:
      context: ./cutter
      dockerfile: Dockerfile.backend
    container_name: cutter_backend
    restart: unless-stopped
    labels:
      - "wud.watch=false"
      - "kuma.cutter-backend.docker.name=Cutter backend"
      - "kuma.cutter-backend.docker.docker_container=cutter_backend"
    expose:
      - "8000"
    environment:
      - TZ=${TZ}
    networks:
      - cutter-net

  # Cutter web - React UI on nginx (proxies /remove-bg, /add-bleed to backend)
  cutter-frontend:
    build:
      context: ./cutter
      dockerfile: Dockerfile.frontend
    container_name: cutter_frontend
    restart: unless-stopped
    depends_on:
      - cutter-backend
    labels:
      - "wud.watch=false"
      - "kuma.cutter-frontend.docker.name=Cutter"
      - "kuma.cutter-frontend.docker.docker_container=cutter_frontend"
      - "kuma.cutter-frontend-web.http.name=Cutter web"
      - "kuma.cutter-frontend-web.http.url=http://192.168.1.200:8083/"
    ports:
      - "8083:80"
    environment:
      - TZ=${TZ}
    networks:
      - cutter-net

  # Emby - Media server (hw transcode via /dev/dri, libraries over CIFS)
  emby:
    image: emby/embyserver:latest
    container_name: emby
    labels:
      - "kuma.emby.docker.name=Emby"
      - "kuma.emby.docker.docker_container=emby"
      - "kuma.emby-web.http.name=Emby web"
      - "kuma.emby-web.http.url=http://192.168.1.200:8096/web/index.html"
    restart: unless-stopped
    environment:
      - UID=1000
      - GID=1000
      - GIDLIST=1000,44,993   # own gid, video=44, render=993
      - TZ=${TZ}
    ports:
      - "8096:8096"    # http
      - "8920:8920"    # https
    devices:
      - /dev/dri:/dev/dri   # Intel/AMD hw transcode. Remove if no iGPU.
    volumes:
      - ./emby/config:/config
      - movies:/media/movies
      - movies2:/media/movies2
      - movies3:/media/movies3
      - movies4:/media/movies4
      - movies4k:/media/movies4k
      - series:/media/series
      - music:/media/music
      - camera:/media/camera

  # Uptime Kuma - Uptime monitoring with Telegram alerts. Monitors are not
  # created in the UI: AutoKuma builds them from the kuma.* labels above.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    labels:
      # :latest is still 1.x. :2 is a rolling tag that WUD would parse as
      # semver 2.0.0 and never update; see "Rolling major tags" in README.
      - 'wud.tag.transform=^\d+()$$ => rolling$$1'
    ports:
      - "3002:3001"   # 3001 is taken by Dockhand
    volumes:
      - ./uptime-kuma/data:/app/data
      # Read-only is enough for "Docker Container" monitors
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      # Skip the v2 first-run database picker
      - UPTIME_KUMA_DB_TYPE=sqlite

  # AutoKuma - Syncs kuma.* container labels into Uptime Kuma monitors.
  # Also owns the Telegram notification and the Docker host entry.
  autokuma:
    image: ghcr.io/bigboot/autokuma:latest
    container_name: autokuma
    restart: unless-stopped
    depends_on:
      - uptime-kuma
    labels:
      - "kuma.autokuma.docker.name=AutoKuma"
      - "kuma.autokuma.docker.docker_container=autokuma"

      # Entities every monitor refers to (see AUTOKUMA__DEFAULT_SETTINGS)
      - "kuma.local.docker_host.name=Local Docker"
      - "kuma.local.docker_host.connection_type=socket"
      - "kuma.local.docker_host.path=/var/run/docker.sock"
      - "kuma.telegram.notification.name=Telegram"
      - "kuma.telegram.notification.active=true"
      # isDefault/applyExisting mirror what Uptime Kuma stores; without them
      # AutoKuma sees a diff and rewrites the notification every 5 seconds.
      - 'kuma.telegram.notification.config={"type":"telegram","telegramBotToken":"${TELEGRAM_BOT_TOKEN}","telegramChatID":"${TELEGRAM_CHAT_ID}","isDefault":false,"applyExisting":false}'
    volumes:
      # Maps AutoKuma ids to Uptime Kuma ids. Lose it and every monitor,
      # the notification and the Docker host get created a second time.
      - ./autokuma/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - AUTOKUMA__KUMA__URL=http://uptime-kuma:3001
      - AUTOKUMA__KUMA__USERNAME=${UPTIME_KUMA_USERNAME}
      - AUTOKUMA__KUMA__PASSWORD=${UPTIME_KUMA_PASSWORD}
      # Keep monitors whose container is gone. The default (delete) drops a
      # monitor and its history 60s after its container is removed, so a
      # service left down by an interrupted deploy vanishes instead of
      # alerting, and comes back later as a new monitor with no history.
      - AUTOKUMA__ON_DELETE=keep
      # Applied to every generated monitor: alert on Telegram, check
      # containers through the local socket, and retry twice before
      # declaring a service down so a WUD recreate does not page.
      # The first setting must share the line with the "=": a leading
      # newline fails with "Found invalid config 'kuma.default_settings'".
      - |-
        AUTOKUMA__DEFAULT_SETTINGS=*.notification_name_list: ["telegram"]
        docker.docker_host_name: local
        *.max_retries: 2

networks:
  camera-net:
    driver: bridge
  cutter-net:
    driver: bridge

volumes:
  movies:
    driver_opts: &cifs
