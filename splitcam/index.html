<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Viewer - Split Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .cameras-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .camera-section {
            display: flex;
            flex-direction: column;
        }

        .camera-title {
            color: #333;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6c757d;
            transition: background 0.3s;
        }

        .status-dot.connecting {
            background: #ffc107;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.error {
            background: #dc3545;
        }

        .status-dot.disconnected {
            background: #6c757d;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }



        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .cameras-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; width: 100%;">📹 Camera Viewer</h1>

        <div class="cameras-grid">
            <div class="camera-section">
                <div class="camera-title">
                    <span class="status-dot disconnected" id="status1" title="Disconnected"></span>
                    Living Room
                </div>
                <div class="video-container">
                    <video id="video1" controls autoplay muted playsinline></video>
                    <div class="loading" id="loading1">
                        <div class="spinner"></div>
                        <div>Connecting...</div>
                    </div>
                </div>
            </div>

            <div class="camera-section">
                <div class="camera-title">
                    <span class="status-dot disconnected" id="status2" title="Disconnected"></span>
                    Upstairs
                </div>
                <div class="video-container">
                    <video id="video2" controls autoplay muted playsinline></video>
                    <div class="loading" id="loading2">
                        <div class="spinner"></div>
                        <div>Connecting...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="connectBtn" onclick="connectAll()">Connect All Cameras</button>
            <button id="disconnectBtn" onclick="disconnectAll()">Disconnect All</button>
            <button onclick="reconnectAll()">Reconnect</button>
        </div>
    </div>

    <script>
        const cameras = [
            { id: 1, name: 'camera1', pc: null },
            { id: 2, name: 'camera2', pc: null }
        ];

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');

        function updateStatus(cameraId, message, type) {
            const statusDot = document.getElementById(`status${cameraId}`);
            statusDot.className = `status-dot ${type}`;
            // Set tooltip text based on type
            let tooltip = '';
            switch(type) {
                case 'connected':
                    tooltip = 'Connected'; break;
                case 'connecting':
                    tooltip = 'Connecting...'; break;
                case 'error':
                    tooltip = 'Connection error'; break;
                case 'disconnected':
                default:
                    tooltip = 'Disconnected'; break;
            }
            statusDot.title = tooltip;
        }

        async function connectCamera(camera) {
            const video = document.getElementById(`video${camera.id}`);
            const loading = document.getElementById(`loading${camera.id}`);

            try {
                loading.style.display = 'block';
                updateStatus(camera.id, 'Connecting...', 'connecting');

                // Close existing connection
                if (camera.pc) {
                    camera.pc.close();
                }

                // Create new peer connection
                camera.pc = new RTCPeerConnection({
                    iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
                });

                // Handle incoming tracks
                camera.pc.ontrack = (event) => {
                    console.log(`Camera ${camera.id} received track:`, event.track.kind);
                    video.srcObject = event.streams[0];
                    loading.style.display = 'none';
                    updateStatus(camera.id, 'Connected', 'connected');
                    
                    // Ensure video plays
                    video.play().catch(e => {
                        console.log(`Camera ${camera.id} autoplay issue:`, e);
                        // Autoplay might be blocked, but user can click play
                    });
                };

                // Handle connection state
                camera.pc.onconnectionstatechange = () => {
                    console.log(`Camera ${camera.id} state:`, camera.pc.connectionState);
                    if (camera.pc.connectionState === 'failed' || camera.pc.connectionState === 'disconnected') {
                        loading.style.display = 'none';
                        updateStatus(camera.id, 'Connection lost', 'error');
                    }
                };

                // Log ICE candidates
                camera.pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log(`Camera ${camera.id} ICE candidate:`, event.candidate.candidate);
                    }
                };

                // Add transceivers for video and audio
                camera.pc.addTransceiver('video', {direction: 'recvonly'});
                camera.pc.addTransceiver('audio', {direction: 'recvonly'});

                // Create and set local offer
                const offer = await camera.pc.createOffer();
                await camera.pc.setLocalDescription(offer);

                // Wait for ICE gathering to complete
                if (camera.pc.iceGatheringState !== 'complete') {
                    await new Promise(resolve => {
                        const checkState = () => {
                            if (camera.pc.iceGatheringState === 'complete') {
                                camera.pc.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        camera.pc.addEventListener('icegatheringstatechange', checkState);
                        // Timeout after 3 seconds
                        setTimeout(resolve, 3000);
                    });
                }

                // Send offer to go2rtc and get answer
                const response = await fetch(`/api/webrtc?src=${camera.name}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: camera.pc.localDescription.sdp
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const answer = await response.text();
                await camera.pc.setRemoteDescription({
                    type: 'answer',
                    sdp: answer
                });

                console.log(`Camera ${camera.id} connected successfully`);

            } catch (error) {
                console.error(`Camera ${camera.id} error:`, error);
                loading.style.display = 'none';
                updateStatus(camera.id, `Error: ${error.message}`, 'error');
            }
        }

        function disconnectCamera(camera) {
            const video = document.getElementById(`video${camera.id}`);
            const loading = document.getElementById(`loading${camera.id}`);
            
            if (camera.pc) {
                camera.pc.close();
                camera.pc = null;
            }
            video.srcObject = null;
            loading.style.display = 'none';
            updateStatus(camera.id, 'Disconnected', 'disconnected');
        }

        async function connectAll() {
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            
            for (const camera of cameras) {
                await connectCamera(camera);
            }
        }

        function disconnectAll() {
            for (const camera of cameras) {
                disconnectCamera(camera);
            }
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }

        async function reconnectAll() {
            disconnectAll();
            await new Promise(resolve => setTimeout(resolve, 500));
            connectAll();
        }

        // Auto-connect on page load
        window.addEventListener('load', () => {
            console.log('Auto-connecting cameras...');
            connectAll();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', disconnectAll);
    </script>
</body>
</html>
