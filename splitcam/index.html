<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Viewer - Split Screen</title>
    <script>
        // ?embed=1 -> compact, scrollbar-free layout for dashboard iframes (e.g. Homarr)
        (function () {
            var v = new URLSearchParams(location.search).get('embed');
            if (v !== null && v !== '0' && v !== 'false') {
                document.documentElement.classList.add('embed');
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #000;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
        }

        h1 {
            color: #eee;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .cameras-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .camera-section {
            display: flex;
            flex-direction: column;
        }

        .camera-title {
            color: #eee;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6c757d;
            transition: background 0.3s;
        }

        .status-dot.connecting {
            background: #ffc107;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.error {
            background: #dc3545;
        }

        .status-dot.disconnected {
            background: #6c757d;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }



        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .cameras-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
        /* ---------- Embed mode (?embed=1) ----------
           Fill the iframe exactly: no title, no buttons, no scrolling.
           Cameras stack vertically in tall/narrow frames and sit side by
           side once the frame is wider than 16:9 (the point where side by
           side gives each 16:9 video more room than stacking). */
        html.embed,
        html.embed body {
            height: 100%;
            overflow: hidden;
        }

        html.embed body {
            background: #000;
            padding: 0;
            min-height: 0;
        }

        html.embed .container {
            height: 100%;
            max-width: none;
            padding: 4px;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }

        html.embed h1,
        html.embed .controls {
            display: none;
        }

        html.embed .cameras-grid {
            flex: 1;
            min-height: 0;
            margin: 0;
            gap: 4px;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
        }

        @media (min-aspect-ratio: 16/9) {
            html.embed .cameras-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr;
            }
        }

        html.embed .camera-section {
            position: relative;
            min-height: 0;
            min-width: 0;
        }

        /* Camera name floats over the video instead of taking a row */
        html.embed .camera-title {
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 2;
            margin: 0;
            padding: 2px 8px;
            font-size: 0.8em;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 6px;
            pointer-events: none;
        }

        html.embed .status-dot {
            width: 8px;
            height: 8px;
        }

        html.embed .video-container {
            aspect-ratio: auto;
            height: 100%;
            border-radius: 6px;
        }

        html.embed .loading {
            font-size: 14px;
        }

        html.embed .spinner {
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; width: 100%;">📹 Camera Viewer</h1>

        <div class="cameras-grid">
            <div class="camera-section">
                <div class="camera-title">
                    <span class="status-dot disconnected" id="status1" title="Disconnected"></span>
                    Living Room
                </div>
                <div class="video-container">
                    <video id="video1" controls autoplay muted playsinline></video>
                    <div class="loading" id="loading1">
                        <div class="spinner"></div>
                        <div>Connecting...</div>
                    </div>
                </div>
            </div>

            <div class="camera-section">
                <div class="camera-title">
                    <span class="status-dot disconnected" id="status2" title="Disconnected"></span>
                    Upstairs
                </div>
                <div class="video-container">
                    <video id="video2" controls autoplay muted playsinline></video>
                    <div class="loading" id="loading2">
                        <div class="spinner"></div>
                        <div>Connecting...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="connectBtn" onclick="connectAll()">Connect All Cameras</button>
            <button id="disconnectBtn" onclick="disconnectAll()">Disconnect All</button>
            <button onclick="reconnectAll()">Reconnect</button>
        </div>
    </div>

    <script>
        const cameras = [
            { id: 1, name: 'camera1', pc: null, wanted: false, retryTimer: null, retryDelay: 0 },
            { id: 2, name: 'camera2', pc: null, wanted: false, retryTimer: null, retryDelay: 0 }
        ];

        // Auto-reconnect: retry after a drop/failure with exponential backoff
        const RETRY_MIN_MS = 2000;
        const RETRY_MAX_MS = 30000;
        // A 'disconnected' WebRTC state can recover by itself; give it this long first
        const DISCONNECT_GRACE_MS = 5000;

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');

        function updateStatus(cameraId, message, type) {
            const statusDot = document.getElementById(`status${cameraId}`);
            statusDot.className = `status-dot ${type}`;
            statusDot.title = message;
        }

        function clearRetry(camera) {
            if (camera.retryTimer) {
                clearTimeout(camera.retryTimer);
                camera.retryTimer = null;
            }
        }

        function scheduleReconnect(camera, delay) {
            if (!camera.wanted || camera.retryTimer) return;
            const wait = delay ?? camera.retryDelay;
            console.log(`Camera ${camera.id} reconnecting in ${wait} ms`);
            camera.retryTimer = setTimeout(() => {
                camera.retryTimer = null;
                if (!camera.wanted) return;
                // Recovered on its own during the wait
                if (camera.pc && camera.pc.connectionState === 'connected') return;
                connectCamera(camera);
            }, wait);
            camera.retryDelay = Math.min(camera.retryDelay * 2, RETRY_MAX_MS);
        }

        async function connectCamera(camera) {
            const video = document.getElementById(`video${camera.id}`);
            const loading = document.getElementById(`loading${camera.id}`);
            let pc = null;

            clearRetry(camera);

            try {
                loading.style.display = 'block';
                updateStatus(camera.id, 'Connecting...', 'connecting');

                // Close existing connection
                if (camera.pc) {
                    camera.pc.close();
                }

                // Create new peer connection
                pc = new RTCPeerConnection({
                    iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
                });
                camera.pc = pc;

                // Handle incoming tracks
                pc.ontrack = (event) => {
                    if (camera.pc !== pc) return; // stale connection
                    console.log(`Camera ${camera.id} received track:`, event.track.kind);
                    video.srcObject = event.streams[0];
                    loading.style.display = 'none';
                    updateStatus(camera.id, 'Connected', 'connected');

                    // Ensure video plays
                    video.play().catch(e => {
                        console.log(`Camera ${camera.id} autoplay issue:`, e);
                        // Autoplay might be blocked, but user can click play
                    });
                };

                // Handle connection state
                pc.onconnectionstatechange = () => {
                    if (camera.pc !== pc) return; // stale connection
                    const state = pc.connectionState;
                    console.log(`Camera ${camera.id} state:`, state);
                    if (state === 'connected') {
                        clearRetry(camera);
                        camera.retryDelay = RETRY_MIN_MS;
                        updateStatus(camera.id, 'Connected', 'connected');
                    } else if (state === 'disconnected') {
                        updateStatus(camera.id, 'Connection lost, waiting to recover...', 'connecting');
                        scheduleReconnect(camera, DISCONNECT_GRACE_MS);
                    } else if (state === 'failed') {
                        loading.style.display = 'none';
                        updateStatus(camera.id, 'Connection failed, retrying...', 'error');
                        clearRetry(camera);
                        scheduleReconnect(camera);
                    }
                };

                // Log ICE candidates
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log(`Camera ${camera.id} ICE candidate:`, event.candidate.candidate);
                    }
                };

                // Add transceivers for video and audio
                pc.addTransceiver('video', {direction: 'recvonly'});
                pc.addTransceiver('audio', {direction: 'recvonly'});

                // Create and set local offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Wait for ICE gathering to complete
                if (pc.iceGatheringState !== 'complete') {
                    await new Promise(resolve => {
                        const checkState = () => {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        pc.addEventListener('icegatheringstatechange', checkState);
                        // Timeout after 3 seconds
                        setTimeout(resolve, 3000);
                    });
                }

                if (camera.pc !== pc) return; // replaced or disconnected meanwhile

                // Send offer to go2rtc and get answer
                const response = await fetch(`/api/webrtc?src=${camera.name}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: pc.localDescription.sdp
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const answer = await response.text();
                if (camera.pc !== pc) return; // replaced or disconnected meanwhile
                await pc.setRemoteDescription({
                    type: 'answer',
                    sdp: answer
                });

                console.log(`Camera ${camera.id} connected successfully`);

            } catch (error) {
                if (pc && camera.pc !== pc) return; // stale attempt
                console.error(`Camera ${camera.id} error:`, error);
                loading.style.display = 'none';
                updateStatus(camera.id, `Error: ${error.message}, retrying...`, 'error');
                scheduleReconnect(camera);
            }
        }

        function disconnectCamera(camera) {
            const video = document.getElementById(`video${camera.id}`);
            const loading = document.getElementById(`loading${camera.id}`);

            camera.wanted = false;
            clearRetry(camera);
            if (camera.pc) {
                camera.pc.close();
                camera.pc = null;
            }
            video.srcObject = null;
            loading.style.display = 'none';
            updateStatus(camera.id, 'Disconnected', 'disconnected');
        }

        async function connectAll() {
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;

            for (const camera of cameras) {
                camera.wanted = true;
                camera.retryDelay = RETRY_MIN_MS;
                await connectCamera(camera);
            }
        }

        function disconnectAll() {
            for (const camera of cameras) {
                disconnectCamera(camera);
            }
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }

        async function reconnectAll() {
            disconnectAll();
            await new Promise(resolve => setTimeout(resolve, 500));
            connectAll();
        }

        // Auto-connect on page load
        window.addEventListener('load', () => {
            console.log('Auto-connecting cameras...');
            connectAll();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', disconnectAll);
    </script>
</body>
</html>
