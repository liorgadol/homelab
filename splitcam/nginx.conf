# Pick the page for "/": ?embed=<anything but 0/false> serves the widget view
# (embed.html, used by the Homarr iframe), otherwise the web view (index.html).
map $arg_embed $splitcam_page {
    default  /embed.html;
    ""       /index.html;
    "0"      /index.html;
    "false"  /index.html;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow embedding in iframes from any origin
    add_header X-Frame-Options "ALLOWALL" always;
    add_header Content-Security-Policy "frame-ancestors *" always;

    # Enable CORS for WebRTC connections
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # A location's add_header replaces the server-level ones, so the
    # locations below repeat the iframe headers.

    # "/" -> web or widget view (see the map above)
    location = / {
        try_files $splitcam_page =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy go2rtc API and WebRTC requests
    location /api/ {
        proxy_pass http://go2rtc:1984/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disable caching for pages and the shared script so updates show up
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }
}
