<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0b10">
    <title>Cameras</title>
    <!--
        Web view (served at /). The Homarr widget view is embed.html; camera
        logic is shared in cameras.js. Element ids (videoN, loadingN, statusN,
        connectBtn, disconnectBtn) are what cameras.js looks for.
    -->
    <style>
        :root {
            --bg: #0a0b10;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text: #f2f3f7;
            --muted: #8b8fa3;
            --accent: #7c6cff;
            --live: #ff3b4f;
            --ok: #2fd47a;
            --warn: #ffb020;
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 10% -10%, rgba(124, 108, 255, 0.18), transparent 60%),
                radial-gradient(700px 400px at 100% 0%, rgba(118, 75, 162, 0.16), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Header ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            background: rgba(10, 11, 16, 0.6);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 1600px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #7c6cff, #a35bd8);
            box-shadow: 0 6px 20px rgba(124, 108, 255, 0.35);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
        }

        .brand h1 {
            font-size: 1.1rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .brand .meta {
            font-size: 0.8rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .summary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 0.82rem;
            color: var(--muted);
        }

        .summary .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .summary.all-online .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
        .summary.some-online .dot { background: var(--warn); }
        .summary.none-online .dot { background: var(--live); }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 550;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.28);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .btn.primary {
            background: var(--accent);
            border-color: transparent;
        }

        .btn.primary:hover {
            background: #8e80ff;
        }

        /* Connect / Disconnect act as one toggle: cameras.js disables the
           one that doesn't apply, and we simply hide it */
        .btn:disabled {
            display: none;
        }

        /* ---------- Camera grid ---------- */
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius);
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
        }

        .card:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
            box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
        }

        .card:fullscreen {
            border-radius: 0;
            border: 0;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        /* Overlays: top and bottom gradients keep labels readable */
        .overlay {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 14px 16px;
            pointer-events: none;
        }

        .overlay.top {
            top: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
        }

        .overlay.bottom {
            bottom: 0;
            justify-content: flex-end;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .card:hover .overlay.bottom,
        .card:focus-within .overlay.bottom {
            opacity: 1;
        }

        .name {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        /* Classes set by cameras.js: connecting / connected / error / disconnected */
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--muted);
            pointer-events: auto;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-dot.connecting {
            background: var(--warn);
            animation: pulse 1.4s ease-in-out infinite;
        }

        .status-dot.connected {
            background: var(--ok);
            box-shadow: 0 0 10px var(--ok);
        }

        .status-dot.error {
            background: var(--live);
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            border-radius: 6px;
            background: var(--live);
            font-size: 0.7rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.3s, transform 0.3s;
        }

        .live::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            animation: pulse 1.6s ease-in-out infinite;
        }

        .card:has(.status-dot.connected) .live {
            opacity: 1;
            transform: scale(1);
        }

        .icon-btn {
            pointer-events: auto;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(20, 20, 28, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .icon-btn .on { display: none; }
        .icon-btn[aria-pressed="true"] .on { display: block; }
        .icon-btn[aria-pressed="true"] .off { display: none; }

        /* Loading overlay (shown/hidden by cameras.js) */
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--muted);
            font-size: 0.85rem;
            background: radial-gradient(circle at center, rgba(124, 108, 255, 0.08), transparent 60%);
        }

        /* cameras.js toggles inline display:block; keep it centred */
        .loading[style*="block"] {
            display: flex !important;
        }

        /* Between automatic retries cameras.js hides the spinner and marks the
           dot as error; say so instead of showing a bare black box */
        .card:has(.status-dot.error)::after {
            content: 'Connection lost · retrying';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.75rem;
            padding: 8px 24px 28px;
        }

        @media (max-width: 600px) {
            .topbar-inner { padding: 12px 16px; }
            main { padding: 16px; }
            .grid { gap: 14px; }
            .btn span { display: none; }
            .overlay.bottom { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                </div>
                <div>
                    <h1>Cameras</h1>
                    <div class="meta" id="clock">&nbsp;</div>
                </div>
            </div>

            <div class="summary" id="summary"><span class="dot"></span><span id="summaryText">Connecting…</span></div>

            <div class="actions">
                <button class="btn" onclick="reconnectAll()" title="Reconnect all cameras">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                    <span>Reconnect</span>
                </button>
                <button class="btn" id="disconnectBtn" onclick="disconnectAll()" title="Stop all streams">
                    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    <span>Stop</span>
                </button>
                <button class="btn primary" id="connectBtn" onclick="connectAll()" title="Start all streams">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <span>Start</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="grid">
            <section class="card" data-cam="1">
                <video id="video1" autoplay muted playsinline></video>
                <div class="loading" id="loading1">
                    <div class="spinner"></div>
                    <div>Connecting…</div>
                </div>
                <div class="overlay top">
                    <div class="name">
                        <span class="status-dot disconnected" id="status1" title="Disconnected"></span>
                        Living Room
                    </div>
                    <div class="live">LIVE</div>
                </div>
                <div class="overlay bottom">
                    <button class="icon-btn mute" aria-pressed="false" title="Unmute">
                        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                    </button>
                    <button class="icon-btn fullscreen" title="Fullscreen">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    </button>
                </div>
            </section>

            <section class="card" data-cam="2">
                <video id="video2" autoplay muted playsinline></video>
                <div class="loading" id="loading2">
                    <div class="spinner"></div>
                    <div>Connecting…</div>
                </div>
                <div class="overlay top">
                    <div class="name">
                        <span class="status-dot disconnected" id="status2" title="Disconnected"></span>
                        Upstairs
                    </div>
                    <div class="live">LIVE</div>
                </div>
                <div class="overlay bottom">
                    <button class="icon-btn mute" aria-pressed="false" title="Unmute">
                        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                    </button>
                    <button class="icon-btn fullscreen" title="Fullscreen">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    </button>
                </div>
            </section>
        </div>
    </main>

    <footer>Double-click a camera for fullscreen</footer>

    <script src="cameras.js"></script>
    <script>
        // Page-only UI: clock, online summary, mute and fullscreen controls.
        (function () {
            const clock = document.getElementById('clock');
            const tick = () => {
                clock.textContent = new Date().toLocaleString(undefined, {
                    weekday: 'short', day: 'numeric', month: 'short',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            };
            tick();
            setInterval(tick, 1000);

            // "N of M online", driven by the status-dot classes cameras.js sets
            const dots = [...document.querySelectorAll('.status-dot')];
            const summary = document.getElementById('summary');
            const summaryText = document.getElementById('summaryText');
            const updateSummary = () => {
                const online = dots.filter(d => d.classList.contains('connected')).length;
                const connecting = dots.some(d => d.classList.contains('connecting'));
                summary.className = 'summary ' + (online === dots.length ? 'all-online'
                    : online || connecting ? 'some-online' : 'none-online');
                summaryText.textContent = online === 0 && connecting
                    ? 'Connecting…'
                    : `${online} of ${dots.length} online`;
            };
            const observer = new MutationObserver(updateSummary);
            dots.forEach(d => observer.observe(d, { attributes: true, attributeFilter: ['class'] }));
            updateSummary();

            document.querySelectorAll('.card').forEach(card => {
                const video = card.querySelector('video');
                const mute = card.querySelector('.mute');
                const toggleFullscreen = () => {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else if (card.requestFullscreen) {
                        card.requestFullscreen();
                    } else if (video.webkitEnterFullscreen) {
                        video.webkitEnterFullscreen(); // iOS Safari
                    }
                };

                mute.addEventListener('click', () => {
                    video.muted = !video.muted;
                    mute.setAttribute('aria-pressed', String(!video.muted));
                    mute.title = video.muted ? 'Unmute' : 'Mute';
                });
                card.querySelector('.fullscreen').addEventListener('click', toggleFullscreen);
                card.addEventListener('dblclick', toggleFullscreen);
            });
        })();
    </script>
</body>
</html>
