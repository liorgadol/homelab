<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Config Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c9cff' stroke-width='2'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><path d='M14 2v6h6'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Login -->
<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      <span>Config Manager</span>
    </div>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div id="login-error" class="error-text"></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<!-- App -->
<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      <span>Config Manager</span>
    </div>
    <input id="search" class="search" placeholder="Filter configs…">
    <nav id="config-list" class="config-list"></nav>
    <div class="sidebar-footer">
      <button id="audit-btn" class="btn ghost small">Activity log</button>
      <button id="logout-btn" class="btn ghost small">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div id="empty" class="empty">
      <h2>Select a config</h2>
      <p>Files are added through <code>docker-compose.yml</code> — see the README.</p>
    </div>

    <div id="editor-pane" class="editor-pane hidden">
      <header class="toolbar">
        <div class="file-info">
          <div class="file-name"><span id="file-name"></span><span id="dirty-dot" class="dirty hidden" title="Unsaved changes"></span><span id="ro-badge" class="badge hidden">read-only</span></div>
          <div id="file-path" class="file-path"></div>
        </div>
        <div class="actions">
          <button id="history-btn" class="btn ghost">History</button>
          <button id="validate-btn" class="btn ghost">Validate</button>
          <button id="restart-btn" class="btn ghost hidden">Restart</button>
          <button id="save-btn" class="btn">Save</button>
          <button id="save-restart-btn" class="btn primary hidden">Save &amp; restart</button>
        </div>
      </header>
      <div class="editor-area">
        <div id="editor" class="editor"></div>
        <aside id="history-panel" class="history-panel hidden">
          <div class="panel-head">
            <span>History</span>
            <button id="history-close" class="icon-btn" title="Close">✕</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </aside>
      </div>
      <footer class="statusbar">
        <span id="status-text">Ready</span>
        <span id="cursor-pos"></span>
      </footer>
    </div>

    <div id="diff-pane" class="editor-pane hidden">
      <header class="toolbar">
        <div class="file-info">
          <div class="file-name">Compare backup</div>
          <div id="diff-label" class="file-path"></div>
        </div>
        <div class="actions">
          <button id="diff-back" class="btn ghost">Back</button>
          <button id="diff-restore" class="btn primary">Restore this version</button>
        </div>
      </header>
      <div id="diff-editor" class="editor"></div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="panel-head"><span id="modal-title"></span><button id="modal-close" class="icon-btn">✕</button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="/static/vs/loader.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
