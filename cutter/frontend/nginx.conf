server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large image uploads
    client_max_body_size 50m;

    # API proxy to backend service (resolved via docker-compose service name)
    location /remove-bg {
        proxy_pass http://cutter-backend:8000/remove-bg;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /add-bleed {
        proxy_pass http://cutter-backend:8000/add-bleed$is_args$args;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://cutter-backend:8000/health;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
