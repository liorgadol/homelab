# homelabctl - start/stop buttons for allowlisted containers.
#
# This file replaces the image's main /etc/nginx/nginx.conf (not just
# conf.d/default.conf) because workers must run as root: /var/run/docker.sock
# is root:docker 660, and nginx's default "nginx" worker user cannot open it.
#
# The Docker socket is full root on the host, so nothing reaches it except
# the three calls below, and only for containers in $ctr_allowed:
#   GET  /docker/<name>/state   -> container state (list endpoint, no env vars)
#   POST /docker/<name>/start
#   POST /docker/<name>/stop
# Everything else under /docker/ is 403.
#
# To allow another container: add it to the $ctr_allowed map.
# After editing: docker compose restart homelabctl

user root;
worker_processes 1;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;

    upstream docker_sock {
        server unix:/var/run/docker.sock;
    }

    # Containers the page may control
    map $ctr $ctr_allowed {
        default    0;
        withoutbg  1;
    }

    # Pick the page for "/": ?embed=<anything but 0/false> serves the widget
    # view (embed.html, used by the Homarr iframe), otherwise the web view.
    map $arg_embed $homelabctl_page {
        default  /embed.html;
        ""       /index.html;
        "0"      /index.html;
        "false"  /index.html;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Allow embedding in iframes from any origin. A location's add_header
        # replaces these, so the locations below repeat them.
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;

        location = / {
            try_files $homelabctl_page =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Frame-Options "ALLOWALL" always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Disable caching for pages and the shared script so updates show up
        location ~* \.(html|js)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Frame-Options "ALLOWALL" always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # State: the list endpoint filtered to one name. Unlike
        # /containers/<name>/json it does not return the container's env vars.
        location ~ ^/docker/(?<ctr>[a-zA-Z0-9_.-]+)/state$ {
            if ($ctr_allowed = 0) { return 403; }
            limit_except GET { deny all; }
            add_header Cache-Control "no-store";
            proxy_set_header Host docker;
            # filters={"name":["^/?<ctr>$"]}
            proxy_pass http://docker_sock/containers/json?all=1&filters=%7B%22name%22%3A%5B%22%5E%2F%3F$ctr%24%22%5D%7D;
        }

        location ~ ^/docker/(?<ctr>[a-zA-Z0-9_.-]+)/(?<act>start|stop)$ {
            if ($ctr_allowed = 0) { return 403; }
            limit_except POST { deny all; }
            proxy_set_header Host docker;
            # Docker takes no body for these; never forward one from the client
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Content-Type "";
            # docker stop waits up to 10s for a clean exit before killing
            proxy_read_timeout 60s;
            proxy_pass http://docker_sock/containers/$ctr/$act;
        }

        location /docker/ {
            return 403;
        }
    }
}
